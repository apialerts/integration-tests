name: SDK Integration Tests

on:
  workflow_dispatch:

jobs:

  notify-action:
    name: Notify Action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          repository: apialerts/notify-action
          ref: feature/1.4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install --legacy-peer-deps
      - run: npx tsx sample/run.ts --integration-tests --channel testing
        env:
          APIALERTS_API_KEY: ${{ secrets.APIALERTS_TEST_API_KEY }}

  cli:
    name: CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          repository: apialerts/cli
          ref: feature/1.3.0
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
      - run: go build -o apialerts .
      - run: ./apialerts send --key $APIALERTS_API_KEY -m "CLI - minimal"
        env:
          APIALERTS_API_KEY: ${{ secrets.APIALERTS_TEST_API_KEY }}
      - run: ./apialerts send --key $APIALERTS_API_KEY -m "CLI - full" -e "sdk.test" -t "Integration Test" -c "testing" -g "CI/CD,CLI" -l "https://github.com/apialerts/cli/actions"
        env:
          APIALERTS_API_KEY: ${{ secrets.APIALERTS_TEST_API_KEY }}

  csharp:
    name: C# SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          repository: apialerts/apialerts-csharp
          ref: feature/1.0.0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0'
      - run: dotnet run --project sample/ApiAlerts.Sample.csproj -- --integration-tests --channel testing
        env:
          APIALERTS_API_KEY: ${{ secrets.APIALERTS_TEST_API_KEY }}

  dart:
    name: Dart SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          repository: apialerts/apialerts-dart
          ref: feature/1.0.0
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart run sample/run.dart --integration-tests --channel testing
        env:
          APIALERTS_API_KEY: ${{ secrets.APIALERTS_TEST_API_KEY }}

  go:
    name: Go SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          repository: apialerts/apialerts-go
          ref: feature/1.2.0
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
      - run: go run sample/github.go --integration-tests --channel testing
        env:
          APIALERTS_API_KEY: ${{ secrets.APIALERTS_TEST_API_KEY }}

  godot:
    name: Godot SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          repository: apialerts/apialerts-godot
          ref: feature/1.0.0
      - name: Download Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          mv Godot_v4.3-stable_linux.x86_64 godot
          chmod +x godot
      - name: Run sample
        run: ./godot --headless --path . --script sample/sample.gd -- --integration-tests --channel testing
        env:
          APIALERTS_API_KEY: ${{ secrets.APIALERTS_TEST_API_KEY }}

  js:
    name: JS SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          repository: apialerts/apialerts-js
          ref: feature/1.3.0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install --legacy-peer-deps
      - run: npm run build
      - run: npx tsx sample/run.ts --integration-tests --channel testing
        env:
          APIALERTS_API_KEY: ${{ secrets.APIALERTS_TEST_API_KEY }}

  kotlin:
    name: Kotlin SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          repository: apialerts/apialerts-kotlin
          ref: feature/1.1.0
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - run: ./gradlew :sample:run --args='--integration-tests --channel testing'
        env:
          APIALERTS_API_KEY: ${{ secrets.APIALERTS_TEST_API_KEY }}

  php:
    name: PHP SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          repository: apialerts/apialerts-php
          ref: feature/1.0.0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - run: composer install --no-interaction
      - run: php sample/run.php --integration-tests --channel testing
        env:
          APIALERTS_API_KEY: ${{ secrets.APIALERTS_TEST_API_KEY }}

  python:
    name: Python SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          repository: apialerts/apialerts-python
          ref: feature/1.2.0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install .
      - run: python sample/run.py --integration-tests --channel testing
        env:
          APIALERTS_API_KEY: ${{ secrets.APIALERTS_TEST_API_KEY }}

  ruby:
    name: Ruby SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          repository: apialerts/apialerts-ruby
          ref: feature/1.0.0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - run: ruby sample/run.rb --integration-tests --channel testing
        env:
          APIALERTS_API_KEY: ${{ secrets.APIALERTS_TEST_API_KEY }}

  rust:
    name: Rust SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          repository: apialerts/apialerts-rust
          ref: feature/1.1.0
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo run --example run -- --integration-tests --channel testing
        env:
          APIALERTS_API_KEY: ${{ secrets.APIALERTS_TEST_API_KEY }}

  swift:
    name: Swift SDK
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          repository: apialerts/apialerts-swift
          ref: feature/1.2.0
          path: APIAlerts
      - run: swift run --package-path APIAlerts/sample sample --integration-tests --channel testing
        env:
          APIALERTS_API_KEY: ${{ secrets.APIALERTS_TEST_API_KEY }}
