name: Published Package Smoke Tests

on:
  workflow_dispatch:

jobs:

  go:
    name: Go (published)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache-dependency-path: go/go.sum
      - run: go run .
        env:
          APIALERTS_API_KEY: ${{ secrets.APIALERTS_API_KEY }}

  js:
    name: JS (published)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci
      - run: node index.js
        env:
          APIALERTS_API_KEY: ${{ secrets.APIALERTS_API_KEY }}

  python:
    name: Python (published)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python run.py
        env:
          APIALERTS_API_KEY: ${{ secrets.APIALERTS_API_KEY }}

  kotlin:
    name: Kotlin (published)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kotlin
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - run: ./gradlew run --console=plain
        env:
          APIALERTS_API_KEY: ${{ secrets.APIALERTS_API_KEY }}

  java:
    name: Java (published)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - run: ./gradlew run --console=plain
        env:
          APIALERTS_API_KEY: ${{ secrets.APIALERTS_API_KEY }}

  csharp:
    name: C# (published)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: csharp
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0'
      - run: dotnet run
        env:
          APIALERTS_API_KEY: ${{ secrets.APIALERTS_API_KEY }}

  rust:
    name: Rust (published)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo run
        env:
          APIALERTS_API_KEY: ${{ secrets.APIALERTS_API_KEY }}

  swift:
    name: Swift (published)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: swift
    steps:
      - uses: actions/checkout@v6
      - run: swift run
        env:
          APIALERTS_API_KEY: ${{ secrets.APIALERTS_API_KEY }}

  php:
    name: PHP (published)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: php
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - run: composer install --no-interaction
      - run: php index.php
        env:
          APIALERTS_API_KEY: ${{ secrets.APIALERTS_API_KEY }}

  dart:
    name: Dart (published)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dart
    steps:
      - uses: actions/checkout@v6
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart run bin/smoke.dart
        env:
          APIALERTS_API_KEY: ${{ secrets.APIALERTS_API_KEY }}
